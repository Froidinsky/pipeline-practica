name: CI - Pipeline Java

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Testing y Checkstyle
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar, ejecutar tests y empaquetar JAR
        run: mvn --batch-mode clean package

      - name: Analizar codigo con Checkstyle
        run: mvn --batch-mode checkstyle:check

      - name: Subir JAR como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-practica-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
